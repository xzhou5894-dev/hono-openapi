name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Typecheck all
      run: bun run typecheck:all

    - name: Lint backend
      run: bun run lint

    - name: Build frontend
      run: bun --cwd frontend build

    - name: Typecheck backend
      run: bun --cwd backend typecheck

    - name: Build backend
      run: bun --cwd backend build

    - name: Run backend tests
      run: bun --cwd backend test
      continue-on-error: true

    - name: Run frontend tests
      run: bun --cwd frontend test
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: built-frontend
        path: frontend/dist/
        retention-days: 7

    - name: Upload backend build
      uses: actions/upload-artifact@v4
      with:
        name: built-backend
        path: backend/dist/
        retention-days: 7

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: built-frontend
        path: frontend/dist/

    - name: Download backend build
      uses: actions/download-artifact@v4
      with:
        name: built-backend
        path: backend/dist/

    - name: Copy frontend to backend public
      run: |
        mkdir -p backend/public
        cp -a frontend/dist/. backend/public/

    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment..."
        # Add your staging deployment commands here
        # Example: rsync, docker push, etc.
        echo "✅ Staging deployment complete"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && github.event.inputs.deploy_to_prod == 'true'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v1
      with:
        bun-version: latest

    - name: Download frontend build
      uses: actions/download-artifact@v4
      with:
        name: built-frontend
        path: frontend/dist/

    - name: Download backend build
      uses: actions/download-artifact@v4
      with:
        name: built-backend
        path: backend/dist/

    - name: Copy frontend to backend public
      run: |
        mkdir -p backend/public
        cp -a frontend/dist/. backend/public/

    - name: Run database migrations
      run: bun --cwd backend migrate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}

    - name: Deploy to production
      run: |
        echo "🚀 Deploying to production environment..."
        # Add your production deployment commands here
        # Example: rsync, docker push, kubectl apply, etc.
        echo "✅ Production deployment complete"

    - name: Health check
      run: |
        echo "🔎 Running production health check..."
        # Add health check commands here
        # Example: curl --fail https://api.mmcrt.com/health
        echo "✅ Health check passed"
